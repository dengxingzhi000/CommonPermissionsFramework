version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: cpf-postgres
    environment:
      POSTGRES_DB: permissions
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: cpf-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nacos:
    image: nacos/nacos-server:v2.2.0
    container_name: cpf-nacos
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: ""
    ports:
      - "8848:8848"
      - "9848:9848"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8848/nacos/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  system-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: system/service
    container_name: cpf-system-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: permissions
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NACOS_SERVER: nacos:8848
      NACOS_NAMESPACE: public
      NACOS_GROUP: DEFAULT_GROUP
      JWT_SECRET: dGVzdHNlY3JldGtleWZvcnRlc3RpbmdwdXJwb3Nlc29ubHk1MTJiaXRzbG9uZw==
      API_SIGNING_SECRET: dGVzdGFwaXNpZ25pbmdzZWNyZXQ=
      IDENTITY_TOKEN_SECRET: dGVzdGlkZW50aXR5dG9rZW5zZWNyZXQ=
      SERVER_PORT: "8081"
    ports:
      - "8081:8081"

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: auth
    container_name: cpf-auth-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      system-service:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: permissions
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NACOS_SERVER: nacos:8848
      NACOS_NAMESPACE: public
      NACOS_GROUP: DEFAULT_GROUP
      JWT_SECRET: dGVzdHNlY3JldGtleWZvcnRlc3RpbmdwdXJwb3Nlc29ubHk1MTJiaXRzbG9uZw==
      API_SIGNING_SECRET: dGVzdGFwaXNpZ25pbmdzZWNyZXQ=
      IDENTITY_TOKEN_SECRET: dGVzdGlkZW50aXR5dG9rZW5zZWNyZXQ=
      SERVER_PORT: "8082"
    ports:
      - "8082:8082"

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: gateway
    container_name: cpf-gateway
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      auth-service:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: permissions
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NACOS_SERVER: nacos:8848
      NACOS_NAMESPACE: public
      NACOS_GROUP: DEFAULT_GROUP
      JWT_SECRET: dGVzdHNlY3JldGtleWZvcnRlc3RpbmdwdXJwb3Nlc29ubHk1MTJiaXRzbG9uZw==
      API_SIGNING_SECRET: dGVzdGFwaXNpZ25pbmdzZWNyZXQ=
      IDENTITY_TOKEN_SECRET: dGVzdGlkZW50aXR5dG9rZW5zZWNyZXQ=
      SERVER_PORT: "9095"
    ports:
      - "9095:9095"

volumes:
  postgres_data:
  redis_data:
