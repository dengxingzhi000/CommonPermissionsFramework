name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: permissions_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'graalvm'
          cache: maven

      - name: Compile
        run: mvn clean compile -DskipTests -B

      - name: Run tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: permissions_test
          DB_USERNAME: postgres
          DB_PASSWORD: testpass
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: dGVzdHNlY3JldGtleWZvcnRlc3RpbmdwdXJwb3Nlc29ubHk1MTJiaXRzbG9uZw==
        run: mvn test -B -pl common/core,common/data,common/monitoring,common/integration,system/service -am

      - name: Package
        run: mvn package -DskipTests -B -pl auth,gateway,system/service -am

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: services
          path: |
            auth/target/*.jar
            gateway/target/*.jar
            system/service/target/*.jar
          retention-days: 7
